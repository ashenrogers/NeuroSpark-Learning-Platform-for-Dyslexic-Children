name: dyslexia_support_app
description: A mobile application for supporting children with dyslexia
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # Animations
  lottie: ^3.1.2
  animated_text_kit: ^4.2.2
  flutter_staggered_animations: ^1.1.1
  
  # Enhanced UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # HTTP and API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Audio Recording
  flutter_sound: ^9.2.13
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Utilities
  shared_preferences: ^2.2.2
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/
